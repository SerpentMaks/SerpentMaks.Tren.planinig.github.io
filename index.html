<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0b0d10">
  <title>Тренер — дневник тренировок</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css?v=7">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="topbar__brand">ТРЕНЕР</div>
      <div id="active-pill" class="active-pill is-hidden"></div>
    </header>

    <main id="screens">
      <section class="screen" id="screen-home" data-tab="home"></section>
      <section class="screen" id="screen-progress" data-tab="progress"></section>
      <section class="screen" id="screen-workout" data-tab="workout"></section>
      <section class="screen" id="screen-exercises" data-tab="exercises"></section>
      <section class="screen" id="screen-profile" data-tab="profile"></section>
    </main>

    <nav class="tabbar" aria-label="Навигация">
      <button class="tabbar__item" data-nav="home"><span class="tabbar__icon">⌂</span><span>Сегодня</span></button>
      <button class="tabbar__item" data-nav="progress"><span class="tabbar__icon">↗</span><span>Прогресс</span></button>
      <button class="tabbar__item tabbar__item--main" data-nav="workout"><span class="tabbar__plus">+</span><span>Тренировка</span></button>
      <button class="tabbar__item" data-nav="exercises"><span class="tabbar__icon">≡</span><span>Упражнения</span></button>
      <button class="tabbar__item" data-nav="profile"><span class="tabbar__icon">○</span><span>Профиль</span></button>
    </nav>
  </div>

  <div id="sheet" class="sheet is-hidden" aria-hidden="true"></div>
  <div id="toast" class="toast is-hidden" aria-live="polite"></div>

  <script src="./app.js?v=7"></script>
</body>
</html>
